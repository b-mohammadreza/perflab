[package]
name = "perflab"
version = "0.0.0"
edition = "2024"
description = "'Compiler-to-Perf Lab' for MLIR/LLVM (CPU + GPU)"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
nix = { version = "0.31.1", features = ["sched", "process"] }
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
serde_path_to_error = "0.1.20"
